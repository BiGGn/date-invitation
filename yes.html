<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Our Date ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #e75480;
        }

        label {
            display: block;
            margin-top: 20px;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            background: #ff4f81;
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 20px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            color: #e75480;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>It's a Date! ❤️</h1>

        <p>Now, let's plan our little date. 🥰</p>

       <form action="https://formspree.io/f/xyeevygd" method="POST">

    <label>Choose a date:</label>
    <input type="date" name="Date" required>

    <label>Choose a time:</label>
    <select name="Time" required>
        <option value="">Select a time</option>
        <option>10:00 AM</option>
        <option>12:00 PM</option>
        <option>2:00 PM</option>
        <option>4:00 PM</option>
        <option>6:00 PM</option>
    </select>

    <button type="submit">Confirm Our Date ❤️</button>

</form>
           
        </select>
        <h3 id="message"></h3>

    </div>

    <script>
        function confirmDate() {

            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;

            if (date === "" || time === "") {
                alert("Please choose a date and time ❤️");
                return;
            }

            document.getElementById("message").innerHTML =
            "Date confirmed! 🥰<br>" + date + "<br>" + time;
        }
    </script>

</body>
</html>
